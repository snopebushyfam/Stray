; STRAY - engine config. Fully dynamic lighting: nothing is baked, so lights can
; never be "missing" because a lighting build was skipped (the earlier prototype's
; suspected failure). See docs/TECHNICAL_PLAN.md section "Lighting".

[/Script/EngineSettings.GameMapsSettings]
EditorStartupMap=/Game/Stray/Maps/L_P001_Street.L_P001_Street
GameDefaultMap=/Game/Stray/Maps/L_P001_Street.L_P001_Street
GlobalDefaultGameMode=/Script/Stray.StrayGameMode

[/Script/Engine.RendererSettings]
r.AllowStaticLighting=False
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.AutoExposure.Method=0
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.SkyAtmosphere=True
r.SupportSkyAtmosphere=True

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12

[/Script/PythonScriptPlugin.PythonScriptPluginSettings]
; Creates materials + the P001 map on the first editor start (idempotent).
+StartupScripts=stray_setup_p001.py
